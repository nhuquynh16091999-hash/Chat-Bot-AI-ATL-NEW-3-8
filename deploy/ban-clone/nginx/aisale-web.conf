# AI Sale (bản clone) — trang quản lý qua HTTPS: https://139.180.131.21:8449
#
# Chủ shop 09/11/2026: muốn link web, KHÔNG muốn mật khẩu. Trang quản lý sửa được key và luật
# của bot, nên không mở cho cả internet: CHỈ các IP trong /etc/nginx/aisale-web/ip-cho-phep.conf
# vào được, còn lại nhận 403. Đổi mạng / IP nhà mạng đổi → chạy trên máy có khoá SSH:
#     ssh root@139.180.131.21 mo-web
# (thêm IP đang SSH vào danh sách, giữ 5 IP gần nhất).
#
# Trang quản lý (giao_dien.py, 127.0.0.1:8765) tự chặn mọi yêu cầu có Host khác 127.0.0.1 —
# nginx đặt Host = 127.0.0.1:8765, nên lớp chặn THẬT nằm ở đây (allow/deny).
# Chứng chỉ: dùng chung chứng chỉ IP Let's Encrypt (certbot-renew.timer, aisale-acme.conf).
# Không đụng banbot.conf (8447/8448) và talpha-https.conf (443).

server {
    listen 8449 ssl http2;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/139.180.131.21/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/139.180.131.21/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/aisale-web/ip-cho-phep.conf;
    deny all;

    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8765;
        proxy_read_timeout 300s;
    }
}
